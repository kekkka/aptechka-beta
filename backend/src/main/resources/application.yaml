spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aptechka}
    username: ${DB_USERNAME:aptechka}
    password: ${DB_PASSWORD:aptechka}
  jpa:
    open-in-view: false
    hibernate:
      # Liquibase owns the schema (src/main/resources/db/changelog); Hibernate only checks it.
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  # Dose times are the cared-for person's wall-clock times.
  timezone: ${APP_TIMEZONE:Europe/Moscow}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:8765,http://localhost:8765,http://localhost:8080}
