server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # PDF.js ships ES modules as .mjs; browsers refuse them without a JS MIME type.
    location ~ \.mjs$ {
        types {}
        default_type text/javascript;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
